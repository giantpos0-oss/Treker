# Builds BkindExplorer's offline maps from OpenStreetMap and publishes them on the "maps" release.
#
# From the Actions tab, run "Build offline maps":
#   - leave "only" empty to build every U.S. region in tools/us-regions.json (all 50 states,
#     Washington D.C., Puerto Rico and the U.S. Virgin Islands), or
#   - put one id from that file in "only", e.g. us-texas, to rebuild just that one.
# It also runs by itself on the 1st of each month so maps stay current.
#
# Each region is a street database (tools/build_region.py) plus Valhalla routing tiles.
# The last job rebuilds regions.json, the catalog BkindExplorer reads, from every published region.
name: Build offline maps

on:
  workflow_dispatch:
    inputs:
      only:
        description: Region ids to build, comma separated, or all-but:id,id (empty builds all U.S. regions)
        required: false
        default: ""
  schedule:
    - cron: "17 7 1 * *"

permissions:
  contents: write

concurrency:
  group: maps
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      regions: ${{ steps.pick.outputs.regions }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        env:
          ONLY: ${{ inputs.only }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          regions = json.load(open("tools/us-regions.json"))
          only = (os.environ.get("ONLY") or "").strip()
          if only:
              # One id, several ids separated by commas, or "all-but:" followed by ids to skip.
              if only.startswith("all-but:"):
                  skip = {x.strip() for x in only[8:].split(",")}
                  regions = [r for r in regions if r["id"] not in skip]
              else:
                  want = {x.strip() for x in only.split(",")}
                  regions = [r for r in regions if r["id"] in want]
              if not regions:
                  raise SystemExit(f"No regions match {only} in tools/us-regions.json")
          print("regions=" + json.dumps(regions))
          EOF
      - name: Make sure the maps release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view maps >/dev/null 2>&1 || gh release create maps --title "Offline maps" --latest=false \
            --notes "Offline maps for BkindExplorer, built from OpenStreetMap (© OpenStreetMap contributors, ODbL). Download them from inside BkindExplorer, in Help and settings, under Offline maps."

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        region: ${{ fromJson(needs.plan.outputs.regions) }}
    name: ${{ matrix.region.name }}
    env:
      ID: ${{ matrix.region.id }}
      NAME: ${{ matrix.region.name }}
      GROUP: ${{ matrix.region.group }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h .

      - name: Download OpenStreetMap extract
        run: |
          mkdir -p work
          # The download site turns away bursts of connections, so keep trying for up to about 20 minutes.
          # If it still refuses, the same extract from the openstreetmap.fr mirror.
          curl -fL --retry 12 --retry-delay 90 --retry-all-errors --connect-timeout 60 \
            -o work/region.osm.pbf "https://download.geofabrik.de/${{ matrix.region.path }}-latest.osm.pbf" \
          || curl -fL --retry 6 --retry-delay 60 --retry-all-errors --connect-timeout 60 \
            -o work/region.osm.pbf "https://download.openstreetmap.fr/extracts/${{ matrix.region.path }}-latest.osm.pbf"
          ls -la work

      # Zip code, state, county and city areas from the U.S. Census Bureau (public domain), cached.
      - name: Census areas cache
        uses: actions/cache@v4
        with:
          path: census
          key: census-tl_2025-addr-${{ matrix.region.fips }}

      - name: Download Census areas
        env:
          FIPS: ${{ matrix.region.fips }}
        run: |
          mkdir -p census
          get() {
            [ -f "census/$1.shp" ] && return
            curl -fL --retry 8 --retry-delay 30 --retry-all-errors -o "census/$1.zip" "https://www2.census.gov/geo/tiger/TIGER2025/$2/$1.zip"
            unzip -o -q "census/$1.zip" -d census && rm "census/$1.zip"
          }
          get tl_2025_us_zcta520 ZCTA520
          get tl_2025_us_state STATE
          get tl_2025_us_county COUNTY
          get "tl_2025_${FIPS}_place" PLACE || echo "No Census places for this region"
          # House number ranges along every street, one file per county.
          pip install pyshp >/dev/null
          mkdir -p census/addr
          for g in $(python3 -c "
          import shapefile
          r = shapefile.Reader('census/tl_2025_us_county.shp')
          f = [x[0] for x in r.fields[1:]]
          for rec in r.iterRecords():
              if rec[f.index('STATEFP')] == '$FIPS': print(rec[f.index('GEOID')])
          "); do
            [ -f "census/addr/tl_2025_${g}_addrfeat.shp" ] && continue
            curl -fsL --retry 6 --retry-delay 20 --retry-all-errors -o "census/addr/$g.zip" \
              "https://www2.census.gov/geo/tiger/TIGER2025/ADDRFEAT/tl_2025_${g}_addrfeat.zip" \
              && unzip -o -q "census/addr/$g.zip" -d census/addr && rm -f "census/addr/$g.zip" \
              || echo "No address ranges for county $g"
          done
          ls census/addr/*.shp | wc -l
          ls -la census

      # Real address points from Overture Maps (mostly OpenAddresses, i.e. county address data), so house
      # numbers are exact where they exist. Optional: if it fails, house numbers are estimated instead.
      - name: Download address points
        continue-on-error: true
        env:
          FIPS: ${{ matrix.region.fips }}
        run: |
          pip install duckdb pyshp >/dev/null
          rel=$(curl -fsL "https://overturemaps-us-west-2.s3.us-west-2.amazonaws.com/?list-type=2&prefix=release/&delimiter=/" \
            | grep -o '<Prefix>release/[^<]*/</Prefix>' | sed 's#<Prefix>release/##; s#/</Prefix>##' | sort | tail -1)
          echo "Overture release: $rel"
          python3 - "$rel" <<'PY'
          import sys, os, duckdb, shapefile
          rel = sys.argv[1]
          r = shapefile.Reader("census/tl_2025_us_state.shp")
          f = [x[0] for x in r.fields[1:]]
          for sr in r.iterShapeRecords():
              if sr.record[f.index("STATEFP")] == os.environ["FIPS"]:
                  x0, y0, x1, y1 = sr.shape.bbox
                  break
          con = duckdb.connect()
          con.execute("INSTALL httpfs; LOAD httpfs; SET s3_region='us-west-2';")
          con.execute(f"""COPY (
              SELECT number, street, unit, postcode, bbox.ymin AS lat, bbox.xmin AS lon
              FROM read_parquet('s3://overturemaps-us-west-2/release/{rel}/theme=addresses/type=address/*', hive_partitioning=1)
              WHERE country = 'US' AND bbox.xmin BETWEEN {x0} AND {x1} AND bbox.ymin BETWEEN {y0} AND {y1}
          ) TO 'work/points.csv' (HEADER)""")
          print(con.execute("SELECT COUNT(*) FROM read_csv_auto('work/points.csv')").fetchone()[0], "address points")
          PY

      - name: Build street database
        run: |
          pip install osmium shapely numpy pyshp
          python3 tools/build_region.py work/region.osm.pbf "work/$ID.db" --id "$ID" --name "$NAME" --country "United States" \
            --zcta census/tl_2025_us_zcta520.shp \
            --census census/tl_2025_us_state.shp census/tl_2025_us_county.shp $(ls census/tl_2025_${{ matrix.region.fips }}_place.shp 2>/dev/null) \
            --addrfeat census/addr/*.shp $( [ -s work/points.csv ] && echo "--points work/points.csv" )
          gzip -6 -c "work/$ID.db" > "work/$ID.db.gz"

      - name: Build routing tiles with Valhalla
        run: |
          img=ghcr.io/valhalla/valhalla:3.6.3
          docker pull "$img" || { img=ghcr.io/valhalla/valhalla:latest; docker pull "$img"; }
          echo "Using $img"
          docker run --rm -v "$PWD/work:/data" -w /data --entrypoint /bin/bash "$img" -c '
            set -e
            valhalla_build_config --mjolnir-tile-dir /data/tiles --mjolnir-tile-extract /data/tiles.tar > /data/valhalla.json
            valhalla_build_tiles -c /data/valhalla.json /data/region.osm.pbf
            valhalla_build_extract -c /data/valhalla.json -v --overwrite
          '
          sudo chown -R "$USER" work
          rm -rf work/tiles work/region.osm.pbf
          gzip -6 -c work/tiles.tar > "work/$ID.tar.gz"
          rm -f work/tiles.tar
          ls -la work

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'EOF'
          import json, os, sqlite3, datetime
          rid, repo = os.environ["ID"], os.environ["GITHUB_REPOSITORY"]
          meta = dict(sqlite3.connect(f"work/{rid}.db").execute("SELECT key, value FROM meta").fetchall())
          base = f"https://github.com/{repo}/releases/download/maps"
          entry = {
              "id": rid, "name": os.environ["NAME"], "group": os.environ["GROUP"],
              "built": datetime.date.today().isoformat(),
              "bbox": [float(meta["minlat"]), float(meta["minlon"]), float(meta["maxlat"]), float(meta["maxlon"])],
              "db": {"url": f"{base}/{rid}.db.gz", "size": os.path.getsize(f"work/{rid}.db.gz")},
              "tiles": {"url": f"{base}/{rid}.tar.gz", "size": os.path.getsize(f"work/{rid}.tar.gz")},
          }
          json.dump(entry, open(f"work/{rid}.region.json", "w"))
          print(json.dumps(entry, indent=1))
          EOF
          for f in "work/$ID.db.gz" "work/$ID.tar.gz" "work/$ID.region.json"; do
            gh release upload maps "$f" --clobber || { sleep 30; gh release upload maps "$f" --clobber; }
          done

  catalog:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild regions.json from every published region
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cat && cd cat
          gh release download maps -R "${{ github.repository }}" -p "*.region.json"
          python3 - <<'EOF'
          import glob, json
          regions = [json.load(open(f)) for f in sorted(glob.glob("*.region.json"))]
          json.dump({"regions": regions}, open("regions.json", "w"), indent=1)
          print(f"{len(regions)} regions in the catalog")
          EOF
          gh release upload maps regions.json -R "${{ github.repository }}" --clobber
          echo "::notice title=Maps catalog::$(python3 -c 'import json;print(len(json.load(open("regions.json"))["regions"]))') regions available in BkindExplorer."
